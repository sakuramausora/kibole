<head>
  <meta charset="UTF-8">
 <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<div id="nav"></div>
<script src="app.js"></script>

<script>
fetch("nav.html")
  .then(response => response.text())
  .then(data => {
    document.getElementById("nav").innerHTML = data;
  });
</script>

<main class="recipes">

  <h1 class="title">Przenieś się do kulinarnego świata "Kiboli"!</h1>
  <p class="subtitle">Kuchnia inspirowana trybunami. Minimum składników, maksimum emocji.</p>

  <div class="grid">

    <div class="tile" onclick="openRecipe('recipe1')">
      <img src="sałatka.jpeg" alt="Sałatka">
      <div class="tile-title">Sałatka wujka Marka</div>
    </div>

    <div class="tile" onclick="openRecipe('recipe2')">
      <img src="louisiana.jpeg" alt="Louisiana">
      <div class="tile-title">Makaron Louisiana</div>
    </div>

  </div>

</main>

<!-- MODAL -->
<div id="recipeModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeRecipe()">&times;</span>
    <div id="recipeDetails"></div>
  </div>
</div>
